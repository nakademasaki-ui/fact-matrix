<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="6"/>

  <!-- Outer Ring / Compass Globe -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Compass / Matrix Primary Icon -->
  <g filter="url(#glow)">
    <!-- Top-Right Point -->
    <path d="M 256 120 L 330 256 L 256 220 Z" fill="url(#cyanGrad)"/>
    <!-- Bottom-Left Point -->
    <path d="M 256 392 L 182 256 L 256 292 Z" fill="#1e293b"/>
    <!-- Top-Left Point -->
    <path d="M 256 120 L 182 256 L 256 220 Z" fill="#38bdf8"/>
    <!-- Bottom-Right Point -->
    <path d="M 256 392 L 330 256 L 256 292 Z" fill="#0f172a"/>
  </g>

  <!-- Center Pivot Core -->
  <circle cx="256" cy="256" r="22" fill="#060a12" stroke="#00e5ff" stroke-width="5"/>
  <circle cx="256" cy="256" r="8" fill="#00e5ff"/>
</svg>
